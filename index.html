<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUESTRO RETO DE 30 DÍAS 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-dark: #ff477e;
      --pink-main: #ff70a6;
      --pink-light: #ff85a1;
      --pink-soft: #fbb1bd;
      --bg-gradient: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #f7cad0 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #5c223a;
      --gold: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      font-family: 'Fredoka', sans-serif;
      color: var(--text-main);
      padding: 20px 15px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Hearts Background Animation */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      animation: floatUp 10s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 25px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(238, 156, 167, 0.3);
      border: 3px solid #ffffff;
      backdrop-filter: blur(5px);
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      color: var(--pink-dark);
      text-shadow: 2px 2px 0px #ffffff;
      margin-bottom: 5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #8c3a5c;
      font-weight: 500;
    }

    /* Progress bar */
    .progress-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      margin-bottom: 30px;
      border: 3px solid #ffffff;
      text-align: center;
    }

    .progress-title {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 8px;
    }

    .progress-bar {
      background: #ffe3e8;
      height: 22px;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #ffb3c1;
      position: relative;
    }

    .progress-fill {
      background: linear-gradient(90deg, #ff70a6, #ff477e, #ff0a54);
      height: 100%;
      width: 0%;
      border-radius: 15px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 18px;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 20px rgba(220, 100, 130, 0.15);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 28px rgba(220, 100, 130, 0.25);
    }

    .day-badge {
      display: inline-block;
      background: linear-gradient(45deg, var(--pink-main), var(--pink-dark));
      color: white;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(255, 71, 126, 0.3);
      margin-bottom: 12px;
      align-self: flex-start;
    }

    .challenge-text {
      font-size: 1.05rem;
      line-height: 1.45;
      color: #4a152b;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .callout-prompt {
      font-size: 0.88rem;
      color: #a8426d;
      background: #fff0f3;
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      border-left: 4px solid var(--pink-main);
      font-style: italic;
    }

    /* Buttons */
    .btn-complete {
      background: linear-gradient(45deg, #ff477e, #ff70a6);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 126, 0.35);
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .btn-complete:hover {
      transform: scale(1.03);
      background: linear-gradient(45deg, #e03163, #ff5c93);
    }

    .btn-complete:active {
      transform: scale(0.97);
    }

    /* Completed state */
    .card.completed {
      background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
      border-color: #ff85a1;
      box-shadow: 0 6px 16px rgba(255, 112, 166, 0.2);
    }

    .card.completed .day-badge {
      background: #ff0a54;
    }

    .card.completed .btn-complete {
      display: none;
    }

    .card.completed .callout-prompt {
      display: none;
    }

    .love-reward {
      display: none;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px dashed #ff477e;
      text-align: center;
      margin-top: 10px;
    }

    .card.completed .love-reward {
      display: block;
    }

    .love-reward-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff477e;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .love-reward-text {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      font-weight: 700;
      color: #c9184a;
      line-height: 1.2;
    }

    .completed-check {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.6rem;
      color: #ff0a54;
      display: none;
    }

    .card.completed .completed-check {
      display: block;
    }

    /* Reset Section */
    .reset-container {
      text-align: center;
      margin-top: 40px;
    }

    .btn-reset {
      background: #ffffff;
      color: #a8426d;
      border: 2px dashed #ff70a6;
      padding: 8px 18px;
      border-radius: 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: #ffe3e8;
      color: #ff477e;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Modal for celebration */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 4px solid #ff70a6;
      box-shadow: 0 15px 35px rgba(255, 71, 126, 0.4);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: var(--pink-dark);
      margin-bottom: 10px;
    }

    .modal-message {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #c9184a;
      margin-bottom: 20px;
      background: #ffe3e8;
      padding: 12px;
      border-radius: 15px;
    }

    .btn-modal {
      background: var(--pink-dark);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts"></div>

  <div class="container">
    <header>
      <h1>Nuestro Reto de 30 Días 💖</h1>
      <p class="subtitle">Un desafío lleno de amor para estar más cerquita tú y yo ✨</p>
    </header>

    <div class="progress-box">
      <div class="progress-title" id="progressText">¡Comencemos este reto juntos mi amor! (0 / 30)</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="reset-container">
      <button class="btn-reset" onclick="resetAllProgress()">🔄 Reiniciar todo a cero (para tus pruebas)</button>
    </div>
  </div>

  <!-- Modal Popup -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon">🎉💖✨</div>
      <div class="modal-title">¡Desafío Completado Reina!</div>
      <div class="modal-message" id="modalLoveText"></div>
      <button class="btn-modal" onclick="closeModal()">¡Te amo muchísimo mi vida! 💕</button>
    </div>
  </div>

  <script>
    const challengesData = [
      {
        task: "Mándame una foto de tu espacio actual o de lo primero que ves al despertar hoy.",
        love: "¡Me haces extremadamente feliz cada día, reina! 💕"
      },
      {
        task: "Compartamos nuestra canción favorita del momento y escuchemosla exactamente al mismo tiempo.",
        love: "¡Estoy muy orgulloso de ti y de todo lo que eres, bb! 🌟"
      },
      {
        task: "Mándame un audio contándome tu recuerdo favorito juntos o nuestra llamada más divertida.",
        love: "Sos la mejor persona del mundo entero, mi vida. 🥰"
      },
      {
        task: "Escribe una cartita o nota corta a mano, tómale foto y mándamela.",
        love: "Cada día a tu lado es un regalo precioso, reina hermosa. 💌"
      },
      {
        task: "Hagamos una lista de 5 cosas que admiramos del otro y leámonoslas por llamada.",
        love: "Eres mi persona favorita en todo el universo. 🌍❤️"
      },
      {
        task: "Mándame un meme o sticker gracioso que sientas que me describe perfecto a mí o a nosotros.",
        love: "Amo tu sonrisa y la forma en que alegras mis días, bb. 😊✨"
      },
      {
        task: "Recrea una foto antigua tuya o de los dos y mándamela para compararla.",
        love: "¡Mi lugar favorito en el mundo siempre es contigo, reina! 🏰💖"
      },
      {
        task: "Noche de peli o serie juntos por Discord o Watch Party. ¡Escríbeme para elegir cuál ver!",
        love: "Eres el amor de mi vida y mi mejor compañía siempre. 🍿🎬"
      },
      {
        task: "Mándame una fotito de lo que vas a almorzar o cenar hoy.",
        love: "¡Gracias por existir y llenar mi vida de tanto amor! 🌸"
      },
      {
        task: "Grábame un mini 'House Tour' o un 'Outfit Check' rápido en video para verte bella.",
        love: "Te ves hermosa siempre, me fascina absolutamente todo de ti, bb. 🔥😍"
      },
      {
        task: "Enviémonos un detalle o snack sorpresa a domicilio. Escríbeme qué se te antoja hoy mi reina.",
        love: "Tu dulzura no tiene límites, me enamoras cada segundo más. 🍰❤️"
      },
      {
        task: "Leamos un capítulo de un libro, cómic o artículo juntos y comentémoslo en llamada.",
        love: "Me encanta aprender y descubrir cosas nuevas a tu lado, mi vida. 📚✨"
      },
      {
        task: "Hagamos un test de personalidad o de 'Lenguajes del Amor' en línea y compartamos los resultados.",
        love: "Hacemos el equipo perfecto, encajamos increíble. 🧩💕"
      },
      {
        task: "Cita por videollamada elegante: ve poniéndote súper linda, arreglemos la hora y escríbeme reina bb.",
        love: "¡Sos un sueño hecho realidad, nunca lo olvides hermosa! 👑💖"
      },
      {
        task: "Jugemos una partida en línea juntos (Roblox, Parchís, o lo que quieras). ¡Escríbeme para entrar!",
        love: "Contigo la vida siempre es más divertida y bonita, reina. 🎮🥳"
      },
      {
        task: "Hagámonos 3 preguntas profundas sobre nuestro futuro o sobre cómo nos hemos sentido últimamente.",
        love: "Amo la conexión tan profunda y única que tenemos tú y yo. 🌌❤️"
      },
      {
        task: "Preparemos la misma bebida o snack y tomémoslo en videollamada mientras hablamos rico.",
        love: "Brindo por nosotros y por todo lo hermoso que se nos viene. 🥂💖"
      },
      {
        task: "Agrega 3 canciones a nuestra playlist compartida de Spotify que te recuerden a nosotros.",
        love: "Eres mi melodía favorita en todo momento, mi vida. 🎵💘"
      },
      {
        task: "Mándame una lista con 3 lugares del mundo que sueñas que visitemos juntos.",
        love: "Pronto vamos a recorrer el mundo entero juntitos, reina. ✈️🗺️"
      },
      {
        task: "Juguemos a 'Verdad o Reto' con preguntas y retos divertidos por chat.",
        love: "Me encantas en todas tus formas y facetas, bb. 😜❤️"
      },
      {
        task: "Hazme un dibujo improvisado tuyo (a mano o digital) y mándamelo.",
        love: "Para mí eres la obra de arte más perfecta del planeta. 🎨😍"
      },
      {
        task: "Planiemos nuestro próximo reencuentro ideal: qué comeremos, a dónde iremos y nuestro primer abrazo.",
        love: "Contando los días para abrazarte súper fuerte y no soltarte más. 🫂❤️"
      },
      {
        task: "Grábame un video corto contándome algo divertido o curioso que te haya pasado esta semana.",
        love: "Amo escuchar tu voz y ver la luz de tus ojos, mi reina. 🎥✨"
      },
      {
        task: "Mándame un screenshot de la pantalla de inicio o fondo de tu teléfono.",
        love: "Ocupas el lugar más especial de mi corazón (y de mi pantalla), bb. 📱💖"
      },
      {
        task: "Noche de preguntas sin filtro: podemos hacernos 3 preguntas directas cada uno.",
        love: "Confío en ti ciegamente, eres mi refugio seguro, mi vida. 🛡️💕"
      },
      {
        task: "Compartamos una meta personal a corto plazo y pensemos cómo apoyarnos el uno al otro.",
        love: "Siempre voy a estar aquí para apoyarte y aplaudir tus logros, reina. 👏🌟"
      },
      {
        task: "Mándame una nota de voz deseándome un bonito día antes de que yo despierte.",
        love: "Despertar sabiendo que estás en mi vida es mi mayor bendición. 🌅❤️"
      },
      {
        task: "Hagamos un collage rápido con capturas de pantalla de nuestras videollamadas de este mes.",
        love: "Miren cuánto hemos compartido y sonreído juntos, bb. 📸🥰"
      },
      {
        task: "Escríbeme en una nota 3 promesas hermosas para nuestro próximo mes juntos.",
        love: "Te prometo amarte, cuidarte y hacerte feliz cada día más. 💍💖"
      },
      {
        task: "Videollamada especial de celebración por terminar este reto juntos, brindando por nuestro amor.",
        love: "¡LO LOGRAMOS MI REINA! Sos lo mejor que me ha pasado en la vida. 🎉👑❤️"
      }
    ];

    // LocalStorage con estado permanente
    let completedStates = JSON.parse(localStorage.getItem('reto_pareja_permanente')) || {};

    const grid = document.getElementById('grid');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const modal = document.getElementById('modal');
    const modalLoveText = document.getElementById('modalLoveText');

    function createBackgroundHearts() {
      const container = document.getElementById('bgHearts');
      container.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-bg';
        heart.innerHTML = ['💖', '💕', '🌸', '✨', '💗'][Math.floor(Math.random() * 5)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (6 + Math.random() * 8) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(heart);
      }
    }

    function updateProgress() {
      const count = Object.keys(completedStates).length;
      const percentage = (count / 30) * 100;
      progressFill.style.width = percentage + '%';
      progressText.textContent = `¡Progreso de Nuestro Amor! (${count} de 30 completados) 💕`;
    }

    function completeDay(index) {
      if (completedStates[index]) return;

      completedStates[index] = true;
      localStorage.setItem('reto_pareja_permanente', JSON.stringify(completedStates));

      // Mostrar popup con la frase de amor
      modalLoveText.textContent = challengesData[index].love;
      modal.classList.add('active');

      renderGrid();
      updateProgress();
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    function resetAllProgress() {
      if (confirm("¿Quieres reiniciar todas las casillas para dejárselo como nuevo a tu reina?")) {
        completedStates = {};
        localStorage.removeItem('reto_pareja_permanente');
        renderGrid();
        updateProgress();
      }
    }

    function renderGrid() {
      grid.innerHTML = '';
      challengesData.forEach((item, index) => {
        const isDone = !!completedStates[index];
        const dayNum = index + 1;

        const card = document.createElement('div');
        card.className = `card ${isDone ? 'completed' : ''}`;

        card.innerHTML = `
          <div class="completed-check">💖</div>
          <div>
            <span class="day-badge">Día ${dayNum}</span>
            <div class="challenge-text">${item.task}</div>
            ${!isDone ? `<div class="callout-prompt">👉 Día ${dayNum}: Regresa acá y confirma si completaste el día con tu novio :)</div>` : ''}
          </div>
          ${!isDone ? `
            <button class="btn-complete" onclick="completeDay(${index})">
              ¡Completado reina! ✨
            </button>
          ` : `
            <div class="love-reward">
              <div class="love-reward-title">Mensaje de mi corazón:</div>
              <div class="love-reward-text">"${item.love}"</div>
            </div>
          `}
        `;

        grid.appendChild(card);
      });
    }

    createBackgroundHearts();
    renderGrid();
    updateProgress();
  </script>
</body>
</html>
